name: codeql
# Reviewed exception to the manual only workflow policy in SECURITY.md. CodeQL
# is a static analyzer on the safe pull_request trigger (not
# pull_request_target), so fork pull requests run with a read-only token and no
# secrets, and cannot use security-events: write. Automatic and scheduled scans
# are the point of code scanning, so these triggers are intended here, and only
# here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
