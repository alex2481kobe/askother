name: ci

# Runs on pushes to main and on pull requests. Safe for outside pull requests: read-only token, no secrets, and GitHub asks
# the owner to approve workflows from first-time contributors. Never add
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      # A build must never rewrite go.mod on its own.
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
