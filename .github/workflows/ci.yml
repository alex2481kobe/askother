name: ci

# Manual only by policy: workflows run when a maintainer starts them. Do not
# add automatic push, pull_request, pull_request_target or scheduled triggers
# without owner review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      # A build must never rewrite go.mod on its own.
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
